<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>方案 C · 动态剧场</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #0c0f16; color: #dbe2f0; display: flex; flex-direction: column;
  }
  .glass { background: rgba(19,24,37,.72); border: 1px solid rgba(255,255,255,.06); border-radius: 14px; backdrop-filter: blur(12px); }
  /* 顶部极细工具带 */
  .top { height: 42px; flex: none; display: flex; align-items: center; padding: 0 14px; gap: 12px; background: rgba(14,17,23,.9); border-bottom: 1px solid rgba(255,255,255,.05); z-index: 20; }
  .top .logo { font-size: 13.5px; font-weight: 800; }
  .top .logo em { font-style: normal; background: linear-gradient(90deg,#6ea8ff,#b28cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .top .tools { display: flex; gap: 3px; margin: 0 auto; }
  .top .tools button { width: 32px; height: 30px; border-radius: 8px; border: none; background: transparent; color: #7f8ca6; cursor: pointer; font-size: 14px; }
  .top .tools button:hover { background: #1a2130; color: #dbe2f0; }
  .top .tools button.on { background: linear-gradient(135deg,#1d2b47,#231d3a); color: #8db4ff; }
  .top .right { display: flex; gap: 7px; }
  .top .right button { background: transparent; border: 1px solid #2b3446; color: #8b94ab; border-radius: 8px; font-size: 12px; padding: 6px 12px; cursor: pointer; }
  .top .right button.hero { background: linear-gradient(90deg,#2563eb,#7c5cff); border: none; color: #fff; }
  /* 主体 */
  .main { flex: 1; display: flex; min-height: 0; }
  /* 左侧动态面板 */
  .panel { width: 302px; flex: none; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(180deg, rgba(16,20,31,.6), rgba(12,15,22,.2)); }
  .panel h2 { font-size: 11px; color: #5f6b83; letter-spacing: 2.5px; }
  /* 全局卡 */
  .gcard { padding: 14px; display: flex; flex-direction: column; gap: 11px; }
  .gcard .row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: #aab3c5; }
  .toggle { width: 38px; height: 21px; border-radius: 999px; background: #2563eb; position: relative; cursor: pointer; }
  .toggle::after { content: ''; position: absolute; right: 2.5px; top: 2.5px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .toggle.off { background: #2b3446; } .toggle.off::after { right: auto; left: 2.5px; }
  /* 边卡片 */
  .ecard { padding: 0; overflow: hidden; display: flex; }
  .ecard .bar { width: 4px; flex: none; }
  .ecard .bd { flex: 1; padding: 11px 13px; }
  .ecard .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .ecard .name { font-size: 12.5px; font-weight: 600; color: #dbe2f0; }
  .ecard .name span { color: #5f6b83; font-weight: 400; margin: 0 4px; }
  .pk { display: flex; gap: 4px; }
  .pk i { width: 16px; height: 20px; border-radius: 5px; border: 1px solid #2b3446; background: #141a26; cursor: pointer; font-style: normal; font-size: 10.5px; color: #7f8ca6; display: grid; place-items: center; }
  .pk i.on { background: #1d2b47; border-color: #2e4a77; color: #8db4ff; }
  /* 迷你流速条（带流动动画） */
  .flow { height: 5px; border-radius: 3px; background: #1a2130; position: relative; overflow: hidden; margin-top: 9px; }
  .flow i { position: absolute; top: 0; bottom: 0; width: 26%; border-radius: 3px; opacity: .9; animation: slide 1.8s linear infinite; }
  @keyframes slide { from { left: -30%; } to { left: 105%; } }
  .meta { display: flex; justify-content: space-between; font-size: 10.5px; color: #5f6b83; margin-top: 5px; }
  /* 演示卡 */
  .pcard { padding: 13px; display: flex; align-items: center; gap: 11px; }
  .pcard .big { flex: 1; height: 40px; border-radius: 11px; border: none; background: linear-gradient(90deg,#2563eb,#7c5cff); color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 24px #2563eb44; }
  .pcard .steps { font-size: 11px; color: #5f6b83; text-align: center; line-height: 1.7; }
  /* 画布 */
  .canvas { flex: 1; position: relative; display: grid; place-items: center; background-image: radial-gradient(circle, #1b2230 1px, transparent 1px); background-size: 23px 23px; min-width: 0; }
  .badge { position: absolute; top: 16px; right: 18px; font-size: 10.5px; letter-spacing: 3px; color: #3d4657; }
  /* 播放器悬浮条（画布底部） */
  .player { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 999px; }
  .player button { border: 1px solid #2b3446; background: #161c29; color: #aab3c5; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 13px; }
  .player .pp { background: linear-gradient(90deg,#2563eb,#7c5cff); border: none; color: #fff; }
  .player .prog { width: 120px; height: 4px; border-radius: 2px; background: #232a3b; overflow: hidden; }
  .player .prog i { display: block; height: 100%; width: 42%; background: linear-gradient(90deg,#6ea8ff,#b28cff); }
  .player .lab { font-size: 11.5px; color: #8b94ab; }
</style>
</head>
<body>
  <div class="top">
    <span class="logo">⚡Flow<em>Pulse</em></span>
    <div class="tools">
      <button class="on">➚</button><button>▭</button><button>◇</button><button>◯</button><button>↗</button><button>T</button><button>☰</button>
    </div>
    <div class="right"><button>PNG</button><button>GIF</button><button class="hero">分享 ✦</button></div>
  </div>

  <div class="main">
    <div class="panel">
      <h2>DYNAMIC · 动态编排</h2>

      <div class="gcard glass">
        <div class="row"><span>全局流动</span><div class="toggle"></div></div>
        <div class="row"><span>速度</span><span style="color:#8db4ff">1.5x</span></div>
        <div class="row"><span>到达联动</span><div class="toggle"></div></div>
      </div>

      <h2 style="margin-top:2px">FLOWS · 4 条数据流</h2>

      <div class="ecard glass"><div class="bar" style="background:#57d68f"></div><div class="bd">
        <div class="hd"><span class="name">客户端<span>→</span>网关</span><div class="pk"><i>1</i><i class="on">2</i><i>3</i></div></div>
        <div class="flow"><i style="background:#57d68f;animation-duration:2.2s"></i></div>
        <div class="meta"><span>2.2s / 包</span><span>到达 47</span></div>
      </div></div>

      <div class="ecard glass"><div class="bar" style="background:#ffb454"></div><div class="bd">
        <div class="hd"><span class="name">网关<span>→</span>鉴权</span><div class="pk"><i class="on">1</i><i>2</i><i>3</i></div></div>
        <div class="flow"><i style="background:#ffb454;animation-duration:1.6s"></i></div>
        <div class="meta"><span>1.6s / 包</span><span>到达 31</span></div>
      </div></div>

      <div class="ecard glass"><div class="bar" style="background:#6ea8ff"></div><div class="bd">
        <div class="hd"><span class="name">网关<span>→</span>订单</span><div class="pk"><i>1</i><i class="on">2</i><i>3</i></div></div>
        <div class="flow"><i style="background:#6ea8ff;animation-duration:1.9s"></i></div>
        <div class="meta"><span>1.9s / 包</span><span>到达 52</span></div>
      </div></div>

      <div class="ecard glass"><div class="bar" style="background:#ff7a7a"></div><div class="bd">
        <div class="hd"><span class="name">订单<span>→</span>数据库</span><div class="pk"><i class="on">1</i><i>2</i><i>3</i></div></div>
        <div class="flow"><i style="background:#ff7a7a;animation-duration:2.6s"></i></div>
        <div class="meta"><span>2.6s / 包 · 未命中</span><span>到达 18</span></div>
      </div></div>

      <div class="pcard glass">
        <button class="big">▶ 播放演示</button>
        <div class="steps">29 步脚本<br/>✨ 一键生成</div>
      </div>
    </div>

    <div class="canvas">
      <div class="badge">DESIGN C · MOTION</div>
      <svg width="620" height="400" viewBox="0 0 960 480">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566074"/></marker>
          <linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#6ea8ff"/><stop offset="1" stop-color="#b28cff"/></linearGradient>
        </defs>
        <g fill="none" stroke-width="2">
          <path d="M175,240 L262,240" stroke="#57d68f" stroke-dasharray="7 5"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path>
          <path d="M352,222 C420,180 450,140 470,120" stroke="#ffb454" stroke-dasharray="7 5" marker-end="url(#ah)"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path>
          <path d="M352,258 C420,300 450,340 470,360" stroke="#6ea8ff" stroke-dasharray="7 5" marker-end="url(#ah)"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path>
          <path d="M652,380 L724,380" stroke="#ff7a7a" stroke-dasharray="7 5" marker-end="url(#ah)"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path>
        </g>
        <circle r="5.5" fill="#57d68f" style="filter:drop-shadow(0 0 6px #57d68f)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M175,240 L262,240"/></circle>
        <circle r="5.5" fill="#57d68f" style="filter:drop-shadow(0 0 6px #57d68f)"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite" path="M175,240 L262,240"/></circle>
        <circle r="5.5" fill="#ffb454" style="filter:drop-shadow(0 0 6px #ffb454)"><animateMotion dur="1.6s" repeatCount="indefinite" path="M352,222 C420,180 450,140 470,120"/></circle>
        <circle r="5.5" fill="url(#glow)" style="filter:drop-shadow(0 0 6px #6ea8ff)"><animateMotion dur="1.9s" repeatCount="indefinite" path="M352,258 C420,300 450,340 470,360"/></circle>
        <circle r="5.5" fill="#ff7a7a" style="filter:drop-shadow(0 0 6px #ff7a7a)"><animateMotion dur="2.6s" repeatCount="indefinite" path="M652,380 L724,380"/></circle>
        <g font-family="system-ui,'Microsoft YaHei'" text-anchor="middle">
          <g><rect x="60" y="214" width="115" height="52" rx="12" fill="#131826" stroke="#57d68f" stroke-width="1.5"/><text x="117" y="245" font-size="14" fill="#dbe2f0">📱 客户端</text></g>
          <g><rect x="262" y="212" width="90" height="56" rx="12" fill="#131826" stroke="#6ea8ff" stroke-width="1.5"/><text x="307" y="245" font-size="14" fill="#dbe2f0">🛡 网关</text></g>
          <g><rect x="470" y="66" width="110" height="56" rx="28" fill="#131826" stroke="#ffb454" stroke-width="1.5"/><text x="525" y="99" font-size="14" fill="#dbe2f0">🔑 鉴权</text></g>
          <g><rect x="470" y="352" width="112" height="56" rx="12" fill="#131826" stroke="#6ea8ff" stroke-width="1.5"/><text x="526" y="385" font-size="14" fill="#dbe2f0">📦 订单</text></g>
          <g><rect x="724" y="352" width="118" height="56" rx="14" fill="#131826" stroke="#ff7a7a" stroke-width="1.5"/><text x="783" y="385" font-size="14" fill="#dbe2f0">🗄 数据库</text></g>
        </g>
        <circle cx="526" cy="380" r="16" fill="none" stroke="#6ea8ff" stroke-width="2"><animate attributeName="r" from="14" to="40" dur="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" from=".8" to="0" dur="0.8s" repeatCount="indefinite"/></circle>
      </svg>

      <div class="player glass">
        <button>◀</button><button class="pp">▶</button><button>▶❙</button>
        <div class="prog"><i></i></div>
        <span class="lab">12 / 29 · 流动</span>
      </div>
    </div>
  </div>
</body>
</html>
