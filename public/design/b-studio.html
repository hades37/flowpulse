<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>方案 B · 专业工作台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #0e1117; color: #dbe2f0; display: flex; flex-direction: column; }
  /* 顶栏 */
  .top { height: 50px; flex: none; display: flex; align-items: center; background: #10141d; border-bottom: 1px solid #1f2735; padding: 0 14px; gap: 14px; z-index: 20; }
  .top .logo { font-size: 14.5px; font-weight: 800; }
  .top .logo em { font-style: normal; color: #6ea8ff; }
  .top .file { font-size: 12.5px; color: #8b94ab; background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 5px 10px; width: 170px; outline: none; }
  .top .file:hover { border-color: #2b3446; } .top .file:focus { border-color: #2e4a77; background: #141a26; color: #e2e8f0; }
  .top .group { display: flex; gap: 5px; align-items: center; }
  .top .group.center { margin-left: auto; margin-right: auto; }
  .top button { background: transparent; border: none; color: #8b94ab; font-size: 12.5px; border-radius: 8px; padding: 7px 11px; cursor: pointer; white-space: nowrap; }
  .top button:hover { background: #1a2130; color: #e2e8f0; }
  .top button:disabled { opacity: .35; }
  .top .accent { background: #1d3a2a; color: #7fd8a4; border: 1px solid #2c5e42; }
  .top .accent:hover { background: #24503a; }
  .top .sep { width: 1px; height: 20px; background: #232a3b; }
  /* 播放胶囊（居中） */
  .playbar { display: flex; align-items: center; gap: 8px; background: #141a26; border: 1px solid #2b3446; border-radius: 999px; padding: 5px 12px; }
  .playbar .p { width: 30px; height: 30px; border-radius: 50%; background: #2563eb; color: #fff; border: none; font-size: 12px; cursor: pointer; }
  .playbar input { width: 80px; accent-color: #2563eb; }
  .playbar .v { font-size: 11.5px; color: #8b94ab; min-width: 32px; }
  /* 主体 */
  .main { flex: 1; display: flex; min-height: 0; }
  /* 左 dock + 抽屉 */
  .dock { width: 54px; flex: none; background: #10141d; border-right: 1px solid #1f2735; display: flex; flex-direction: column; padding: 10px 0; gap: 4px; z-index: 15; }
  .dock .it { position: relative; height: 46px; border: none; background: transparent; color: #7f8ca6; font-size: 17px; cursor: pointer; border-radius: 12px; margin: 0 6px; }
  .dock .it:hover { background: #1a2130; color: #dbe2f0; }
  .dock .it.on { background: #16233a; color: #8db4ff; }
  .dock .it.on::before { content: ''; position: absolute; left: -6px; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: #6ea8ff; }
  .drawer { width: 232px; flex: none; background: #10141d; border-right: 1px solid #1f2735; padding: 12px; overflow-y: auto; z-index: 14; }
  .drawer h3 { font-size: 11px; color: #5f6b83; letter-spacing: 2px; margin: 6px 2px 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .cell { display: flex; align-items: center; gap: 7px; background: #161c29; border: 1px solid #232a3b; border-radius: 9px; padding: 8px 9px; font-size: 12px; color: #c6cede; cursor: grab; }
  .cell:hover { border-color: #2e4a77; }
  .cell i { width: 12px; height: 12px; flex: none; border: 1.6px solid currentColor; display: inline-block; }
  /* 画布 */
  .canvas { flex: 1; position: relative; display: grid; place-items: center; background: #0e1117; background-image: radial-gradient(circle, #1d2433 1px, transparent 1px); background-size: 22px 22px; min-width: 0; }
  /* 右侧检查器 */
  .insp { width: 258px; flex: none; background: #10141d; border-left: 1px solid #1f2735; padding: 14px; overflow-y: auto; }
  .insp .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .insp .tabs button { flex: 1; background: #161c29; border: 1px solid #232a3b; border-radius: 8px; color: #8b94ab; font-size: 12.5px; padding: 6px 0; cursor: pointer; }
  .insp .tabs button.on { background: #1d2b47; border-color: #2e4a77; color: #8db4ff; }
  .sec { margin-bottom: 16px; }
  .sec .t { font-size: 11px; color: #5f6b83; margin-bottom: 7px; }
  .sw { display: flex; gap: 7px; flex-wrap: wrap; }
  .sw i { width: 22px; height: 22px; border-radius: 7px; cursor: pointer; border: 2px solid transparent; }
  .sw i.on { border-color: #fff; box-shadow: 0 0 0 2px #0d1017, 0 0 0 3.5px #6ea8ff88; }
  .stepper { display: flex; gap: 6px; }
  .stepper button { flex: 1; background: #161c29; border: 1px solid #232a3b; border-radius: 8px; color: #aab3c5; font-size: 12px; padding: 6px 0; cursor: pointer; }
  .stepper button.on { background: #1d2b47; border-color: #2e4a77; color: #8db4ff; }
  .seg { display: flex; border: 1px solid #232a3b; border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; background: transparent; border: none; color: #8b94ab; font-size: 12px; padding: 7px 0; cursor: pointer; }
  .seg button.on { background: #2563eb; color: #fff; }
  .slider-row { display: flex; align-items: center; gap: 9px; font-size: 12px; color: #8b94ab; }
  .slider-row input { flex: 1; accent-color: #2563eb; }
  .stat { background: #141a26; border: 1px solid #232a3b; border-radius: 10px; padding: 10px 12px; font-size: 12px; color: #8b94ab; line-height: 2; }
  .stat b { color: #dbe2f0; float: right; }
  /* 底部状态条 */
  .status { height: 27px; flex: none; background: #10141d; border-top: 1px solid #1f2735; display: flex; align-items: center; padding: 0 14px; gap: 18px; font-size: 11px; color: #5f6b83; }
  .status .r { margin-left: auto; display: flex; gap: 16px; }
  .status .ok { color: #57d68f; }
</style>
</head>
<body>
  <div class="top">
    <span class="logo">⚡Flow<em>Pulse</em></span>
    <input class="file" value="微服务调用链" />
    <div class="group"><button disabled>↩</button><button>↪</button><button>⊞ 吸附</button></div>
    <div class="group center">
      <div class="playbar">
        <button class="p">▶</button>
        <input type="range" min="0.5" max="3" value="1" /><span class="v">1.0x</span>
        <button class="p" style="background:#161c29;color:#8b94ab;border:1px solid #2b3446">◉</button>
      </div>
    </div>
    <div class="group">
      <button>模板</button><button>Mermaid</button><span class="sep"></span>
      <button class="accent">分享</button><button>PNG</button><button>GIF</button><button>WebM</button>
    </div>
  </div>

  <div class="main">
    <div class="dock">
      <button class="it on" title="形状库">▤</button>
      <button class="it" title="模板">◈</button>
      <button class="it" title="场景脚本">☰</button>
      <button class="it" title="图层">◫</button>
    </div>

    <div class="drawer">
      <h3>基础形状</h3>
      <div class="grid">
        <div class="cell" style="color:#57d68f"><i style="border-radius:999px"></i>开始</div>
        <div class="cell" style="color:#ff7a7a"><i style="border-radius:999px"></i>结束</div>
        <div class="cell" style="color:#6ea8ff"><i></i>过程</div>
        <div class="cell" style="color:#ffb454"><i style="transform:rotate(45deg)"></i>判断</div>
        <div class="cell" style="color:#2dd4bf"><i style="transform:skewX(-18deg)"></i>数据</div>
        <div class="cell" style="color:#2dd4bf"><i style="border-radius:50%/28%"></i>存储</div>
      </div>
      <h3 style="margin-top:14px">服务端</h3>
      <div class="grid">
        <div class="cell" style="color:#6ea8ff"><i></i>API 网关</div>
        <div class="cell" style="color:#6ea8ff"><i></i>微服务</div>
        <div class="cell" style="color:#2dd4bf"><i style="border-radius:50%/28%"></i>数据库</div>
        <div class="cell" style="color:#2dd4bf"><i></i>缓存</div>
        <div class="cell" style="color:#b28cff"><i></i>消息队列</div>
        <div class="cell" style="color:#7f8ca6"><i></i>注册中心</div>
      </div>
      <h3 style="margin-top:14px">客户端</h3>
      <div class="grid">
        <div class="cell" style="color:#57d68f"><i style="border-radius:50%"></i>浏览器</div>
        <div class="cell" style="color:#57d68f"><i style="border-radius:6px 16px"></i>移动端</div>
      </div>
    </div>

    <div class="canvas">
      <svg width="560" height="330" viewBox="0 0 960 480" style="max-width:100%">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#566074"/></marker>
        </defs>
        <g fill="none" stroke-width="2">
          <path d="M175,240 L262,240" stroke="#57d68f" stroke-dasharray="7 5"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path>
          <path d="M352,222 C420,180 450,140 470,120" stroke="#ffb454" stroke-dasharray="7 5" marker-end="url(#ah)"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path>
          <path d="M352,258 C420,300 450,340 470,360" stroke="#6ea8ff" stroke-dasharray="7 5" marker-end="url(#ah)"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path>
          <path d="M652,380 L724,380" stroke="#ff7a7a" stroke-dasharray="7 5" marker-end="url(#ah)"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path>
        </g>
        <circle r="5" fill="#57d68f" style="filter:drop-shadow(0 0 5px #57d68f)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M175,240 L262,240"/></circle>
        <circle r="5" fill="#57d68f" style="filter:drop-shadow(0 0 5px #57d68f)"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite" path="M175,240 L262,240"/></circle>
        <circle r="5" fill="#ffb454" style="filter:drop-shadow(0 0 5px #ffb454)"><animateMotion dur="1.6s" repeatCount="indefinite" path="M352,222 C420,180 450,140 470,120"/></circle>
        <circle r="5" fill="#6ea8ff" style="filter:drop-shadow(0 0 5px #6ea8ff)"><animateMotion dur="1.9s" repeatCount="indefinite" path="M352,258 C420,300 450,340 470,360"/></circle>
        <circle r="5" fill="#ff7a7a" style="filter:drop-shadow(0 0 5px #ff7a7a)"><animateMotion dur="2.6s" repeatCount="indefinite" path="M652,380 L724,380"/></circle>
        <g font-family="system-ui,'Microsoft YaHei'" text-anchor="middle">
          <g><rect x="60" y="214" width="115" height="52" rx="12" fill="#161b26" stroke="#57d68f" stroke-width="1.5"/><text x="117" y="245" font-size="14" fill="#dbe2f0">📱 客户端</text></g>
          <g><rect x="262" y="212" width="90" height="56" rx="12" fill="#161b26" stroke="#6ea8ff" stroke-width="2"/><text x="307" y="245" font-size="14" fill="#dbe2f0">🛡 网关</text></g>
          <g><rect x="470" y="66" width="110" height="56" rx="28" fill="#161b26" stroke="#ffb454" stroke-width="1.5"/><text x="525" y="99" font-size="14" fill="#dbe2f0">🔑 鉴权</text></g>
          <g><rect x="470" y="352" width="112" height="56" rx="12" fill="#161b26" stroke="#6ea8ff" stroke-width="1.5"/><text x="526" y="385" font-size="14" fill="#dbe2f0">📦 订单</text></g>
          <g><rect x="724" y="352" width="118" height="56" rx="14" fill="#161b26" stroke="#ff7a7a" stroke-width="1.5"/><text x="783" y="385" font-size="14" fill="#dbe2f0">🗄 数据库</text></g>
        </g>
        <circle cx="526" cy="380" r="16" fill="none" stroke="#6ea8ff" stroke-width="2"><animate attributeName="r" from="14" to="40" dur="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" from=".8" to="0" dur="0.8s" repeatCount="indefinite"/></circle>
      </svg>
    </div>

    <div class="insp">
      <div class="tabs"><button class="on">属性</button><button>场景</button></div>
      <div class="sec"><div class="t">选中 · 连线「网关 → 订单」</div>
        <div class="seg" style="margin-bottom:10px"><button class="on">⚡ 数据流</button><button>— 普通</button></div>
      </div>
      <div class="sec"><div class="t">数据颜色</div>
        <div class="sw"><i style="background:#6ea8ff" class="on"></i><i style="background:#ffb454"></i><i style="background:#57d68f"></i><i style="background:#ff7a7a"></i><i style="background:#b28cff"></i></div>
      </div>
      <div class="sec"><div class="t">数据包数量</div>
        <div class="stepper"><button>1</button><button class="on">2</button><button>3</button><button>4</button></div>
      </div>
      <div class="sec"><div class="t">流速 · 2.2s / 包</div>
        <div class="slider-row"><input type="range" min="1" max="3.4" step="0.2" value="2.2" /></div>
      </div>
      <div class="sec"><div class="t">图概览</div>
        <div class="stat">
          节点 <b>8</b><br/>数据流连线 <b>7</b><br/>普通连线 <b>1</b><br/>活动数据包 <b>14</b><br/>演示步骤 <b>29</b>
        </div>
      </div>
    </div>
  </div>

  <div class="status">
    <span>88%</span><span>⊢ 已自动保存 14:32</span>
    <div class="r"><span>8 节点 · 8 连线 · 14 数据包</span><span class="ok">● 引擎正常</span></div>
  </div>
</body>
</html>
