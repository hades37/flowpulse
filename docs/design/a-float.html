<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>方案 A · 禅意浮岛（网格 + 双主题）</title>
<style>
  /* ========== 主题变量 ========== */
  :root[data-theme='dark'] {
    --bg: #0e1117;
    --grid: #1c2330;
    --glass-bg: rgba(20, 25, 37, 0.82);
    --glass-border: rgba(255,255,255,0.07);
    --glass-shadow: 0 12px 40px rgba(0,0,0,0.5);
    --text: #dbe2f0;
    --text-dim: #8b94ab;
    --text-faint: #5f6b83;
    --btn-bg: #161c29;
    --btn-border: #2b3446;
    --btn-hover: #1d2433;
    --node-fill: #161b26;
    --accent: #2563eb;
    --swatch-ring: #6ea8ff;
    --dock-on-glow: #2563eb66;
  }
  :root[data-theme='light'] {
    --bg: #f6f7fa;
    --grid: #e3e6ec;
    --glass-bg: rgba(255, 255, 255, 0.88);
    --glass-border: rgba(15, 23, 42, 0.08);
    --glass-shadow: 0 12px 36px rgba(30, 41, 66, 0.14);
    --text: #1f2433;
    --text-dim: #5b6474;
    --text-faint: #9aa3b4;
    --btn-bg: #eef0f5;
    --btn-border: #d8dce5;
    --btn-hover: #e6e9f0;
    --node-fill: #ffffff;
    --accent: #2563eb;
    --swatch-ring: #2563eb;
    --dock-on-glow: #2563eb44;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .25s;
    /* 网格背景（双层线网格） */
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .glass {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(14px);
    box-shadow: var(--glass-shadow);
  }
  /* 左上：logo + 文件名 */
  .brand { position: fixed; top: 18px; left: 18px; display: flex; align-items: center; gap: 10px; padding: 9px 16px 9px 12px; z-index: 10; }
  .brand .logo { font-size: 16px; font-weight: 800; letter-spacing: .3px; }
  .brand .logo em { font-style: normal; color: #6ea8ff; }
  .brand .file { font-size: 12.5px; color: var(--text-dim); border-left: 1px solid var(--btn-border); padding-left: 10px; }
  /* 顶部中央：工具 dock */
  .dock { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 7px 10px; z-index: 10; }
  .dock button {
    width: 38px; height: 38px; border-radius: 10px; border: none; background: transparent;
    color: var(--text-dim); font-size: 16px; cursor: pointer; display: grid; place-items: center; transition: all .15s;
  }
  .dock button:hover { background: var(--btn-hover); color: var(--text); }
  .dock button.on { background: var(--accent); color: #fff; box-shadow: 0 4px 14px var(--dock-on-glow); }
  .dock .sep { width: 1px; background: var(--btn-border); margin: 6px 5px; }
  /* 右上：动态控制 + 主题切换 */
  .motion { position: fixed; top: 18px; right: 18px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; z-index: 10; }
  .motion .btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text-dim); font-size: 14px; cursor: pointer; transition: all .15s; }
  .motion .btn:hover { color: var(--text); }
  .motion .btn.play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .motion .speed { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .motion .speed input { width: 70px; accent-color: var(--accent); }
  /* 左下：zoom */
  .zoom { position: fixed; left: 18px; bottom: 18px; display: flex; align-items: center; gap: 6px; padding: 7px 10px; z-index: 10; font-size: 13px; color: var(--text-dim); }
  .zoom button { width: 28px; height: 28px; border-radius: 8px; border: none; background: var(--btn-bg); color: var(--text-dim); cursor: pointer; }
  /* 右下：提示 */
  .hint { position: fixed; right: 18px; bottom: 18px; padding: 8px 14px; font-size: 11.5px; color: var(--text-faint); z-index: 10; }
  /* 选中上下文浮条 */
  .context { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 9px 14px; z-index: 10; }
  .context .name { font-size: 12.5px; color: var(--text); font-weight: 600; }
  .swatches { display: flex; gap: 6px; }
  .swatches i { width: 18px; height: 18px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .swatches i.on { border-color: #fff; outline: 2px solid var(--swatch-ring); outline-offset: 1px; }
  :root[data-theme='light'] .swatches i.on { border-color: #fff; }
  .context .sep { width: 1px; height: 20px; background: var(--btn-border); }
  .context .act { background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--text-dim); border-radius: 8px; font-size: 12px; padding: 5px 10px; cursor: pointer; }
  .canvas { position: fixed; inset: 0; display: grid; place-items: center; padding-top: 8px; }
  .tag { position: fixed; top: 78px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: 3px; color: var(--text-faint); opacity: .6; z-index: 1; }
</style>
</head>
<body>
  <div class="brand glass"><span class="logo">⚡Flow<em>Pulse</em></span><span class="file">微服务调用链 · 自动保存</span></div>

  <div class="dock glass">
    <button title="选择">➚</button>
    <button title="手型">✋</button>
    <div class="sep"></div>
    <button class="on" title="矩形">▭</button>
    <button title="菱形">◇</button>
    <button title="椭圆">◯</button>
    <button title="箭头">↗</button>
    <button title="文字">T</button>
    <div class="sep"></div>
    <button title="图形库">☰</button>
  </div>

  <div class="motion glass">
    <button class="btn play">▶</button>
    <div class="speed">1.0x<input type="range" min="0.5" max="3" value="1" /></div>
    <button class="btn" title="状态联动">◉</button>
    <button class="btn" id="themeBtn" title="切换亮/暗主题">☀️</button>
  </div>

  <div class="zoom glass">
    <button>−</button><span>88%</span><button>＋</button><button title="适应">⛶</button>
  </div>

  <div class="hint glass">双击改字 · 拖角调大小 · 空格 播放/暂停</div>

  <div class="context glass">
    <span class="name">🛡️ API 网关</span>
    <div class="swatches">
      <i style="background:#6ea8ff" class="on"></i><i style="background:#57d68f"></i><i style="background:#ffb454"></i><i style="background:#ff7a7a"></i><i style="background:#b28cff"></i>
    </div>
    <div class="sep"></div>
    <button class="act">⚡ 数据流</button>
    <button class="act">⧉ 复制</button>
    <button class="act">🗑</button>
  </div>

  <div class="tag">DESIGN A · FLOAT · GRID + THEMES</div>

  <div class="canvas">
    <svg width="960" height="480" viewBox="0 0 960 480" style="fill:var(--text)">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b94ab"/></marker>
      </defs>
      <g fill="none" stroke-width="2">
        <path d="M175,240 L262,240" stroke="#57d68f" stroke-dasharray="7 5"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path>
        <path d="M352,222 C420,180 450,140 470,120" stroke="#ffb454" stroke-dasharray="7 5" marker-end="url(#ah)"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path>
        <path d="M352,258 C420,300 450,340 470,360" stroke="#6ea8ff" stroke-dasharray="7 5" marker-end="url(#ah)"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path>
        <path d="M652,380 L724,380" stroke="#ff7a7a" stroke-dasharray="7 5" marker-end="url(#ah)"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path>
      </g>
      <circle r="5" fill="#57d68f" style="filter:drop-shadow(0 0 5px #57d68f)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M175,240 L262,240"/></circle>
      <circle r="5" fill="#57d68f" style="filter:drop-shadow(0 0 5px #57d68f)"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite" path="M175,240 L262,240"/></circle>
      <circle r="5" fill="#ffb454" style="filter:drop-shadow(0 0 5px #ffb454)"><animateMotion dur="1.6s" repeatCount="indefinite" path="M352,222 C420,180 450,140 470,120"/></circle>
      <circle r="5" fill="#6ea8ff" style="filter:drop-shadow(0 0 5px #6ea8ff)"><animateMotion dur="1.9s" repeatCount="indefinite" path="M352,258 C420,300 450,340 470,360"/></circle>
      <circle r="5" fill="#6ea8ff" style="filter:drop-shadow(0 0 5px #6ea8ff)"><animateMotion dur="1.9s" begin="-0.95s" repeatCount="indefinite" path="M352,258 C420,300 450,340 470,360"/></circle>
      <circle r="5" fill="#ff7a7a" style="filter:drop-shadow(0 0 5px #ff7a7a)"><animateMotion dur="2.6s" repeatCount="indefinite" path="M652,380 L724,380"/></circle>
      <g font-family="system-ui,'Microsoft YaHei'" text-anchor="middle">
        <g><rect x="60" y="214" width="115" height="52" rx="12" fill="var(--node-fill)" stroke="#57d68f" stroke-width="1.5"/><text x="117" y="245" font-size="14">📱 客户端</text></g>
        <g><rect x="262" y="212" width="90" height="56" rx="12" fill="var(--node-fill)" stroke="#6ea8ff" stroke-width="2"/><rect x="256" y="206" width="102" height="68" rx="16" fill="none" stroke="#6ea8ff" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 4"/><text x="307" y="245" font-size="14">🛡 网关</text></g>
        <g><rect x="470" y="66" width="110" height="56" rx="28" fill="var(--node-fill)" stroke="#ffb454" stroke-width="1.5"/><text x="525" y="99" font-size="14">🔑 鉴权</text></g>
        <g><rect x="470" y="352" width="112" height="56" rx="12" fill="var(--node-fill)" stroke="#6ea8ff" stroke-width="1.5"/><text x="526" y="385" font-size="14">📦 订单</text></g>
        <g><rect x="724" y="352" width="118" height="56" rx="14" fill="var(--node-fill)" stroke="#ff7a7a" stroke-width="1.5"/><text x="783" y="385" font-size="14">🗄 数据库</text></g>
      </g>
      <circle cx="526" cy="380" r="16" fill="none" stroke="#6ea8ff" stroke-width="2"><animate attributeName="r" from="14" to="40" dur="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" from=".8" to="0" dur="0.8s" repeatCount="indefinite"/></circle>
    </svg>
  </div>

  <script>
    const btn = document.getElementById('themeBtn')
    btn.addEventListener('click', () => {
      const root = document.documentElement
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark'
      root.dataset.theme = next
      btn.textContent = next === 'dark' ? '☀️' : '🌙'
    })
  </script>
</body>
</html>
